# Configuração local do PostgreSQL 16 para o IlhaRolê.
# Aplicada pelo serviço `db` através de:
#   postgres -c config_file=/etc/postgresql/postgresql.conf
#
# Os valores são conservadores para desenvolvimento em Docker Desktop.
# Em produção, dimensione shared_buffers/effective_cache_size pela memória do host.

listen_addresses = '*'
port = 5432

# Memória e paralelismo
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 64MB
work_mem = 8MB
max_connections = 100
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# Custo de I/O para SSD/NVMe (padrão do Docker Desktop)
random_page_cost = 1.1
effective_io_concurrency = 200
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 128MB

# Observabilidade de consultas
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on
log_min_duration_statement = 500ms
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'America/Fortaleza'

# Sessão e segurança
timezone = 'America/Fortaleza'
datestyle = 'iso, dmy'
password_encryption = 'scram-sha-256'
idle_in_transaction_session_timeout = '30s'
lock_timeout = '10s'
statement_timeout = 0

# Autovacuum mais atento em banco pequeno de desenvolvimento
autovacuum_naptime = '30s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
