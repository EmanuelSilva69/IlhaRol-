<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-feira-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
    <clipPath id="ir-feira-roof-clip">
      <path d="M8.5 16 20 8.5 31.5 16Z" />
    </clipPath>
    <filter id="ir-feira-shadow" x="-30%" y="-20%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#78350f" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .ir-feira-sparkle {
      animation: ir-feira-pop 1.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-feira-sparkle-2 { animation-delay: 0.6s; }
    .ir-feira-sparkle-3 { animation-delay: 1.2s; }

    .ir-feira-bunting {
      animation: ir-feira-bunting 2.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 20px 16px;
    }

    @keyframes ir-feira-pop {
      0%, 100% { transform: scale(0.35); opacity: 0; }
      35% { transform: scale(1.1); opacity: 1; }
      70% { transform: scale(0.8); opacity: 0.6; }
    }

    @keyframes ir-feira-bunting {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-feira-sparkle,
      .ir-feira-bunting {
        animation: none;
      }

      .ir-feira-sparkle {
        opacity: 0.6;
      }
    }
  </style>

  <g filter="url(#ir-feira-shadow)">
    <path
      d="M20 2C10.8 2 3 9.8 3 19c0 11.5 17 19 17 19s17-7.5 17-19C37 9.8 29.2 2 20 2Z"
      fill="url(#ir-feira-pin)"
      stroke="#ffffff"
      stroke-width="2"
    />
  </g>

  <circle cx="20" cy="18.5" r="14" fill="#fffbeb" />

  <path d="M11.5 16v10.5" stroke="#92400e" stroke-width="1.6" stroke-linecap="round" />
  <path d="M28.5 16v10.5" stroke="#92400e" stroke-width="1.6" stroke-linecap="round" />

  <g clip-path="url(#ir-feira-roof-clip)">
    <rect x="8.5" y="8.5" width="23" height="7.5" fill="#f97316" />
    <rect x="11.5" y="8.5" width="3.2" height="7.5" fill="#fde68a" />
    <rect x="18.2" y="8.5" width="3.2" height="7.5" fill="#fde68a" />
    <rect x="24.9" y="8.5" width="3.2" height="7.5" fill="#fde68a" />
  </g>

  <path d="M8.5 16 20 8.5 31.5 16Z" fill="none" stroke="#92400e" stroke-width="1" stroke-linejoin="round" />

  <g class="ir-feira-bunting">
    <path d="M12 16l1.5 2.2 1.5-2.2Z" fill="#22c55e" />
    <path d="M16 16l1.5 2.2 1.5-2.2Z" fill="#3b82f6" />
    <path d="M20 16l1.5 2.2 1.5-2.2Z" fill="#ef4444" />
    <path d="M24 16l1.5 2.2 1.5-2.2Z" fill="#a855f7" />
  </g>

  <rect x="10.5" y="25" width="19" height="2.8" rx="1" fill="#92400e" />
  <circle cx="14" cy="23.4" r="1.3" fill="#16a34a" />
  <circle cx="18" cy="23.4" r="1.3" fill="#facc15" />
  <circle cx="22" cy="23.4" r="1.3" fill="#ef4444" />
  <circle cx="26" cy="23.4" r="1.3" fill="#3b82f6" />

  <g fill="#fbbf24">
    <path class="ir-feira-sparkle" d="M9 10.5 9.7 12.3 11.5 13 9.7 13.7 9 15.5 8.3 13.7 6.5 13 8.3 12.3Z" />
    <path class="ir-feira-sparkle ir-feira-sparkle-2" d="M31 11 31.6 12.4 33 13 31.6 13.6 31 15 30.4 13.6 29 13 30.4 12.4Z" />
    <path class="ir-feira-sparkle ir-feira-sparkle-3" d="M30.5 21.5 31.1 22.9 32.5 23.5 31.1 24.1 30.5 25.5 29.9 24.1 28.5 23.5 29.9 22.9Z" />
  </g>
</svg>
