<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" width="44" height="52" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-music-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="ir-music-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4c1d95" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .ir-music-note {
      animation: ir-music-beat 1.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-music-ring {
      animation: ir-music-ring 1.6s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes ir-music-beat {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(1.12); }
      60% { transform: scale(0.98); }
    }

    @keyframes ir-music-ring {
      0% { transform: scale(0.8); opacity: 0.55; }
      70%, 100% { transform: scale(1.35); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-music-note,
      .ir-music-ring {
        animation: none;
      }

      .ir-music-ring {
        opacity: 0;
      }
    }
  </style>

  <g filter="url(#ir-music-shadow)">
    <path
      d="M22 1.5C10.7 1.5 1.5 10.7 1.5 22c0 14.2 20.5 28.5 20.5 28.5S42.5 36.2 42.5 22C42.5 10.7 33.3 1.5 22 1.5Z"
      fill="url(#ir-music-pin)"
      stroke="#ffffff"
      stroke-width="2"
    />
  </g>

  <circle cx="22" cy="22" r="13" fill="#f5f3ff" />
  <circle class="ir-music-ring" cx="22" cy="22" r="11" fill="none" stroke="#c4b5fd" stroke-width="2" />

  <g class="ir-music-note" fill="#6d28d9">
    <path
      d="M20 27.5V15.2l9-1.8v10.8"
      fill="none"
      stroke="#6d28d9"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <ellipse cx="17.4" cy="28" rx="3.1" ry="2.4" />
    <ellipse cx="26.4" cy="26.2" rx="3.1" ry="2.4" />
  </g>
</svg>
