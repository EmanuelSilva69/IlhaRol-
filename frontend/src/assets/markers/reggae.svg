<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-reggae-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a" />
      <stop offset="0.5" stop-color="#eab308" />
      <stop offset="1" stop-color="#dc2626" />
    </linearGradient>
    <filter id="ir-reggae-shadow" x="-30%" y="-20%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#14532d" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .ir-reggae-bounce {
      animation: ir-reggae-bounce 0.9s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-reggae-wave {
      animation: ir-reggae-wave 1.4s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-reggae-wave-2 {
      animation-delay: 0.5s;
    }

    @keyframes ir-reggae-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-1.4px) scale(1.05); }
    }

    @keyframes ir-reggae-wave {
      0% { transform: scale(0.78); opacity: 0.15; }
      35% { opacity: 0.95; }
      100% { transform: scale(1.14); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-reggae-bounce,
      .ir-reggae-wave {
        animation: none;
      }

      .ir-reggae-wave {
        opacity: 0.55;
      }
    }
  </style>

  <g filter="url(#ir-reggae-shadow)">
    <path
      d="M28 3C15.3 3 5 13.3 5 26c0 16 23 27 23 27s23-11 23-27C51 13.3 40.7 3 28 3Z"
      fill="url(#ir-reggae-pin)"
      stroke="#ffffff"
      stroke-width="2"
    />
  </g>

  <circle cx="28" cy="25" r="16" fill="#fefce8" />
  <circle cx="28" cy="25" r="16" fill="none" stroke="#facc15" stroke-width="1.2" opacity="0.8" />

  <g
    class="ir-reggae-wave"
    fill="none"
    stroke="#15803d"
    stroke-width="1.7"
    stroke-linecap="round"
  >
    <path d="M18 20c-1.8 1.4-2.8 3.1-2.8 5s1 3.6 2.8 5" />
    <path d="M15.5 17.5c-2.4 1.9-3.8 4.5-3.8 7.5s1.4 5.6 3.8 7.5" opacity="0.75" />
  </g>

  <g
    class="ir-reggae-wave ir-reggae-wave-2"
    fill="none"
    stroke="#15803d"
    stroke-width="1.7"
    stroke-linecap="round"
  >
    <path d="M38 20c1.8 1.4 2.8 3.1 2.8 5s-1 3.6-2.8 5" />
    <path d="M40.5 17.5c2.4 1.9 3.8 4.5 3.8 7.5s-1.4 5.6-3.8 7.5" opacity="0.75" />
  </g>

  <g class="ir-reggae-bounce">
    <rect x="19.5" y="14.5" width="17" height="22" rx="3" fill="#1f2937" stroke="#111827" stroke-width="1.2" />
    <circle cx="28" cy="20" r="2.8" fill="#facc15" />
    <circle cx="28" cy="30.5" r="5.4" fill="#374151" stroke="#facc15" stroke-width="1.4" />
    <circle cx="28" cy="30.5" r="2.1" fill="#dc2626" />
    <circle cx="33.6" cy="17.2" r="0.9" fill="#22c55e" />
  </g>
</svg>
