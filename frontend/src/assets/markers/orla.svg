<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-orla-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
    <filter id="ir-orla-shadow" x="-30%" y="-20%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#164e63" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .ir-orla-leaf {
      animation: ir-orla-sway 3.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 18px 16.5px;
    }

    .ir-orla-leaf-2 { animation-delay: 0.5s; }
    .ir-orla-leaf-3 { animation-delay: 1s; }
    .ir-orla-leaf-4 { animation-delay: 1.5s; }

    .ir-orla-wave {
      animation: ir-orla-wave 2.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-orla-wave-2 { animation-delay: 0.8s; }

    .ir-orla-sun {
      animation: ir-orla-sun 3.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes ir-orla-sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    @keyframes ir-orla-wave {
      0%, 100% { transform: translateX(-1.6px); opacity: 0.75; }
      50% { transform: translateX(1.6px); opacity: 1; }
    }

    @keyframes ir-orla-sun {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-orla-leaf,
      .ir-orla-wave,
      .ir-orla-sun {
        animation: none;
      }
    }
  </style>

  <g filter="url(#ir-orla-shadow)">
    <path
      d="M20 2C10.8 2 3 9.8 3 19c0 11.5 17 19 17 19s17-7.5 17-19C37 9.8 29.2 2 20 2Z"
      fill="url(#ir-orla-pin)"
      stroke="#ffffff"
      stroke-width="2"
    />
  </g>

  <circle cx="20" cy="18.5" r="14" fill="#ecfeff" />

  <g class="ir-orla-sun" stroke="#f59e0b" stroke-width="1.1" stroke-linecap="round">
    <circle cx="27" cy="11.5" r="3.3" fill="#fbbf24" stroke="none" />
    <path d="M27 6.5v-1.2" />
    <path d="M31.5 8l0.9-0.9" />
    <path d="M32.5 12.5h1.2" />
  </g>

  <path d="M13.5 28c1.2-5 2.7-8.8 5-11.5" fill="none" stroke="#92400e" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="18.5" cy="16.8" r="1.1" fill="#78350f" />
  <circle cx="17.2" cy="17.8" r="0.9" fill="#78350f" />

  <g fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round">
    <path class="ir-orla-leaf" d="M18.5 16.5c-4-3-7-2-9 1" />
    <path class="ir-orla-leaf ir-orla-leaf-2" d="M18.5 16.5c-2-4-1-6 2-7.5" />
    <path class="ir-orla-leaf ir-orla-leaf-3" d="M18.5 16.5c2-3 5-4 8-2" />
    <path class="ir-orla-leaf ir-orla-leaf-4" d="M18.5 16.5c4-1 6 1 6.5 3.5" />
  </g>

  <g fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round">
    <path class="ir-orla-wave" d="M7 28c2.5-1.8 5 1.8 7.5 0s5 1.8 7.5 0 5 1.8 7.5 0" />
    <path class="ir-orla-wave ir-orla-wave-2" d="M7.5 31c2.5-1.8 5 1.8 7.5 0s5 1.8 7.5 0 5 1.8 7.5 0" opacity="0.7" />
  </g>
</svg>
