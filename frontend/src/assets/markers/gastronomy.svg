<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" width="44" height="52" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-gastronomy-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>
    <filter id="ir-gastronomy-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#9a3412" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .ir-gastronomy-plate {
      animation: ir-gastronomy-spin 14s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-gastronomy-steam {
      animation: ir-gastronomy-rise 2.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-gastronomy-steam-2 {
      animation-delay: 0.6s;
    }

    .ir-gastronomy-steam-3 {
      animation-delay: 1.2s;
    }

    @keyframes ir-gastronomy-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes ir-gastronomy-rise {
      0% { transform: translateY(2px); opacity: 0; }
      25% { opacity: 0.85; }
      70% { opacity: 0.5; }
      100% { transform: translateY(-5px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-gastronomy-plate,
      .ir-gastronomy-steam {
        animation: none;
      }

      .ir-gastronomy-steam {
        opacity: 0.35;
      }
    }
  </style>

  <g filter="url(#ir-gastronomy-shadow)">
    <path
      d="M22 1.5C10.7 1.5 1.5 10.7 1.5 22c0 14.2 20.5 28.5 20.5 28.5S42.5 36.2 42.5 22C42.5 10.7 33.3 1.5 22 1.5Z"
      fill="url(#ir-gastronomy-pin)"
      stroke="#ffffff"
      stroke-width="2"
    />
  </g>

  <circle cx="22" cy="22" r="13" fill="#fff7ed" />

  <g
    class="ir-gastronomy-steam"
    fill="none"
    stroke="#fb923c"
    stroke-width="1.6"
    stroke-linecap="round"
  >
    <path d="M18 18c-2-2 2-3 0-5" />
    <path class="ir-gastronomy-steam-2" d="M22 17.5c-2-2 2-3 0-5" />
    <path class="ir-gastronomy-steam-3" d="M26 18c-2-2 2-3 0-5" />
  </g>

  <g class="ir-gastronomy-plate">
    <circle cx="22" cy="25" r="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.6" />
    <circle cx="22" cy="25" r="5.2" fill="none" stroke="#fdba74" stroke-width="1.2" />
    <circle cx="22" cy="25" r="2.2" fill="#fb923c" />
    <path
      d="M23 21.5c2-1.6 4.5-1 5 0.5-1.8 1.4-4 1.2-5-0.5Z"
      fill="#65a30d"
    />
  </g>
</svg>
