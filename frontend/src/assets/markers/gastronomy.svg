<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-gastro-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c" />
      <stop offset="1" stop-color="#c2410c" />
    </linearGradient>
    <filter id="ir-gastro-shadow" x="-30%" y="-20%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#9a3412" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .ir-gastro-glow {
      animation: ir-gastro-glow 3.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-gastro-steam {
      animation: ir-gastro-rise 2.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-gastro-steam-2 { animation-delay: 0.45s; }
    .ir-gastro-steam-3 { animation-delay: 0.9s; }

    @keyframes ir-gastro-glow {
      0%, 100% { opacity: 0.14; }
      50% { opacity: 0.38; }
    }

    @keyframes ir-gastro-rise {
      0% { transform: translateY(2px); opacity: 0; }
      28% { opacity: 0.9; }
      70% { opacity: 0.45; }
      100% { transform: translateY(-4.5px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-gastro-glow,
      .ir-gastro-steam {
        animation: none;
      }

      .ir-gastro-glow {
        opacity: 0.22;
      }

      .ir-gastro-steam {
        opacity: 0.45;
      }
    }
  </style>

  <g filter="url(#ir-gastro-shadow)">
    <path
      d="M20 2C10.8 2 3 9.8 3 19c0 11.5 17 19 17 19s17-7.5 17-19C37 9.8 29.2 2 20 2Z"
      fill="url(#ir-gastro-pin)"
      stroke="#ffffff"
      stroke-width="2"
    />
  </g>

  <circle cx="20" cy="18.5" r="14" fill="#fff7ed" />
  <circle class="ir-gastro-glow" cx="20" cy="24" r="9.5" fill="#fbbf24" opacity="0.2" />

  <g
    fill="none"
    stroke="#fb923c"
    stroke-width="1.4"
    stroke-linecap="round"
  >
    <path class="ir-gastro-steam ir-gastro-steam-1" d="M14.5 16.5c-1.4-1.8 1.4-2.8 0-4.6" />
    <path class="ir-gastro-steam ir-gastro-steam-2" d="M20 15.5c-1.4-1.8 1.4-2.8 0-4.6" />
    <path class="ir-gastro-steam ir-gastro-steam-3" d="M25.5 16.5c-1.4-1.8 1.4-2.8 0-4.6" />
  </g>

  <circle cx="20" cy="24" r="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.3" />
  <circle cx="20" cy="24" r="5.4" fill="none" stroke="#fdba74" stroke-width="1" />

  <path
    d="M15.5 24c2-2.4 5.5-2.4 7.5 0-2 2.4-5.5 2.4-7.5 0Z"
    fill="#f59e0b"
    stroke="#b45309"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  <path d="M23 24l2.6-1.8v3.6L23 24Z" fill="#f59e0b" stroke="#b45309" stroke-width="0.8" stroke-linejoin="round" />
  <circle cx="17" cy="23.6" r="0.5" fill="#1c1917" />

  <circle cx="24" cy="20.8" r="1.6" fill="#84cc16" stroke="#4d7c0f" stroke-width="0.5" />
</svg>
