<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-tambor-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#db2777" />
      <stop offset="0.55" stop-color="#c026d3" />
      <stop offset="1" stop-color="#6d28d9" />
    </linearGradient>
    <clipPath id="ir-tambor-skirt-clip">
      <path d="M22 18h12l5 11c0 4.5-4.9 8-11 8s-11-3.5-11-8Z" />
    </clipPath>
    <filter id="ir-tambor-shadow" x="-30%" y="-20%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#831843" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .ir-tambor-skirt {
      animation: ir-tambor-punga 1.15s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 8%;
    }

    .ir-tambor-ribbon {
      animation: ir-tambor-flutter 0.75s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-tambor-ribbon-2 { animation-delay: 0.15s; }
    .ir-tambor-ribbon-3 { animation-delay: 0.3s; }

    .ir-tambor-motion {
      animation: ir-tambor-motion 1.15s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes ir-tambor-punga {
      0%, 100% { transform: rotate(-10deg) scale(1); }
      50% { transform: rotate(12deg) scale(1.04); }
    }

    @keyframes ir-tambor-flutter {
      0%, 100% { transform: translateY(0) rotate(-4deg); opacity: 0.85; }
      50% { transform: translateY(-1.4px) rotate(5deg); opacity: 1; }
    }

    @keyframes ir-tambor-motion {
      0% { transform: scale(0.8); opacity: 0.9; }
      70%, 100% { transform: scale(1.25); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-tambor-skirt,
      .ir-tambor-ribbon,
      .ir-tambor-motion {
        animation: none;
      }

      .ir-tambor-motion {
        opacity: 0;
      }
    }
  </style>

  <g filter="url(#ir-tambor-shadow)">
    <path
      d="M28 3C15.3 3 5 13.3 5 26c0 16 23 27 23 27s23-11 23-27C51 13.3 40.7 3 28 3Z"
      fill="url(#ir-tambor-pin)"
      stroke="#ffffff"
      stroke-width="2"
    />
  </g>

  <circle cx="28" cy="25" r="16" fill="#fdf4ff" />
  <circle cx="28" cy="25" r="16" fill="none" stroke="#f0abfc" stroke-width="1.2" opacity="0.9" />

  <g
    class="ir-tambor-motion"
    fill="none"
    stroke="#e879f9"
    stroke-width="1.6"
    stroke-linecap="round"
  >
    <path d="M13 25c-1.5 3-1.2 6 1 8" />
    <path d="M43 25c1.5 3 1.2 6-1 8" />
  </g>

  <g class="ir-tambor-ribbon">
    <path d="M21.5 18c-3-2-5.5-1-6.5 1.5" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" />
  </g>
  <g class="ir-tambor-ribbon ir-tambor-ribbon-2">
    <path d="M34.5 18c3-2 5.5-1 6.5 1.5" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" />
  </g>
  <g class="ir-tambor-ribbon ir-tambor-ribbon-3">
    <path d="M28 17c0-2 1-3.5 2.5-4.2" fill="none" stroke="#facc15" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <rect x="22" y="15.5" width="12" height="2.6" rx="1.3" fill="#facc15" stroke="#b45309" stroke-width="0.6" />

  <g class="ir-tambor-skirt">
    <path
      d="M22 18h12l5 11c0 4.5-4.9 8-11 8s-11-3.5-11-8Z"
      fill="#ec4899"
      stroke="#9d174d"
      stroke-width="1"
      stroke-linejoin="round"
    />

    <g clip-path="url(#ir-tambor-skirt-clip)">
      <rect x="14" y="22" width="28" height="3" fill="#facc15" />
      <rect x="13" y="26" width="30" height="3" fill="#22c55e" />
      <rect x="12" y="30" width="32" height="3" fill="#3b82f6" />
      <rect x="11" y="34" width="34" height="3" fill="#f97316" />
    </g>

    <path
      d="M18 36c1.4 1.8 3.6 1.8 5 0s3.6-1.8 5 0 3.6 1.8 5 0 3.6-1.8 5 0"
      fill="none"
      stroke="#fdf4ff"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.9"
    />
  </g>
</svg>
