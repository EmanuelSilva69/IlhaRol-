<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-samba-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" />
      <stop offset="0.55" stop-color="#ea580c" />
      <stop offset="1" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="ir-samba-shadow" x="-30%" y="-20%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#7c2d12" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .ir-samba-pandeiro {
      animation: ir-samba-shake 0.55s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-samba-jingles {
      animation: ir-samba-jingle 0.32s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-samba-note {
      animation: ir-samba-note 1.8s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-samba-note-2 {
      animation-delay: 0.9s;
    }

    @keyframes ir-samba-shake {
      0%, 100% { transform: rotate(-4deg) translateX(-0.4px); }
      25% { transform: rotate(4deg) translateX(0.6px); }
      50% { transform: rotate(-3deg) translateX(-0.4px); }
      75% { transform: rotate(3deg) translateX(0.6px); }
    }

    @keyframes ir-samba-jingle {
      0%, 100% { transform: translateX(-0.5px); }
      50% { transform: translateX(0.5px); }
    }

    @keyframes ir-samba-note {
      0% { transform: translateY(1px) scale(0.8); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: translateY(-5px) scale(1.05); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-samba-pandeiro,
      .ir-samba-jingles,
      .ir-samba-note {
        animation: none;
      }

      .ir-samba-note {
        opacity: 0.6;
      }
    }
  </style>

  <g filter="url(#ir-samba-shadow)">
    <path
      d="M28 3C15.3 3 5 13.3 5 26c0 16 23 27 23 27s23-11 23-27C51 13.3 40.7 3 28 3Z"
      fill="url(#ir-samba-pin)"
      stroke="#ffffff"
      stroke-width="2"
    />
  </g>

  <circle cx="28" cy="25" r="16" fill="#fffbeb" />
  <circle cx="28" cy="25" r="16" fill="none" stroke="#fcd34d" stroke-width="1.2" opacity="0.85" />

  <g class="ir-samba-note" fill="#16a34a">
    <ellipse cx="13.5" cy="16.5" rx="1.6" ry="1.2" transform="rotate(-20 13.5 16.5)" />
    <path d="M15 16.2V10l3.2-1" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <g class="ir-samba-note ir-samba-note-2" fill="#dc2626">
    <ellipse cx="41.5" cy="14.5" rx="1.4" ry="1.05" transform="rotate(-20 41.5 14.5)" />
    <path d="M42.8 14.2V9l2.8-0.9" fill="none" stroke="#dc2626" stroke-width="1.1" stroke-linecap="round" />
  </g>

  <g class="ir-samba-pandeiro">
    <circle cx="28" cy="26" r="10.5" fill="#fef3c7" stroke="#b45309" stroke-width="1.6" />
    <circle cx="28" cy="26" r="8.5" fill="#fde68a" stroke="#d97706" stroke-width="1" />
    <circle cx="28" cy="26" r="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.8" />

    <g class="ir-samba-jingles" fill="#cbd5e1" stroke="#64748b" stroke-width="0.45">
      <circle cx="37.5" cy="26" r="1.2" />
      <circle cx="32.75" cy="17.77" r="1.2" />
      <circle cx="23.25" cy="17.77" r="1.2" />
      <circle cx="18.5" cy="26" r="1.2" />
      <circle cx="23.25" cy="34.23" r="1.2" />
      <circle cx="32.75" cy="34.23" r="1.2" />
    </g>
  </g>

  <g fill="none" stroke="#ea580c" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <path d="M14 30c-1.8 1.5-2.8 3.4-2.8 5.5" />
    <path d="M42 30c1.8 1.5 2.8 3.4 2.8 5.5" />
  </g>
</svg>
