<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-cinema-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <filter id="ir-cinema-shadow" x="-30%" y="-20%" width="170%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .ir-cinema-reel {
      animation: ir-cinema-spin 6s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes ir-cinema-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-cinema-reel {
        animation: none;
      }
    }
  </style>

  <g filter="url(#ir-cinema-shadow)">
    <path
      d="M16 1.5C8.7 1.5 2.5 7.7 2.5 15c0 9.2 13.5 15.5 13.5 15.5S29.5 24.2 29.5 15C29.5 7.7 23.3 1.5 16 1.5Z"
      fill="url(#ir-cinema-pin)"
      stroke="#ffffff"
      stroke-width="1.6"
    />
  </g>

  <circle cx="16" cy="14.5" r="11.5" fill="#eef2ff" />

  <g class="ir-cinema-reel">
    <circle cx="16" cy="14.5" r="7.5" fill="#1e1b4b" stroke="#312e81" stroke-width="1" />
    <circle cx="16" cy="10.3" r="1.5" fill="#eef2ff" />
    <circle cx="19.99" cy="13.2" r="1.5" fill="#eef2ff" />
    <circle cx="18.47" cy="17.9" r="1.5" fill="#eef2ff" />
    <circle cx="13.53" cy="17.9" r="1.5" fill="#eef2ff" />
    <circle cx="12.01" cy="13.2" r="1.5" fill="#eef2ff" />
    <circle cx="16" cy="14.5" r="2" fill="#c7d2fe" stroke="#818cf8" stroke-width="0.6" />
  </g>
</svg>
