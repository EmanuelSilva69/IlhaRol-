<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-bumba-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316" />
      <stop offset="0.55" stop-color="#ef4444" />
      <stop offset="1" stop-color="#991b1b" />
    </linearGradient>
    <filter id="ir-bumba-shadow" x="-30%" y="-20%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7f1d1d" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .ir-bumba-aura {
      animation: ir-bumba-pulse 2.2s ease-out infinite;
      transform-box: view-box;
      transform-origin: 40px 38px;
    }

    .ir-bumba-aura-2 {
      animation-delay: 1.1s;
    }

    .ir-bumba-ribbon {
      animation: ir-bumba-wave 0.9s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 40px 24px;
    }

    .ir-bumba-ribbon-2 { animation-delay: 0.12s; }
    .ir-bumba-ribbon-3 { animation-delay: 0.24s; }
    .ir-bumba-ribbon-4 { animation-delay: 0.36s; }

    .ir-bumba-face {
      animation: ir-bumba-bob 1.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes ir-bumba-pulse {
      0% { transform: scale(0.72); opacity: 0.9; }
      60% { opacity: 0.25; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    @keyframes ir-bumba-wave {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes ir-bumba-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.2px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-bumba-aura,
      .ir-bumba-ribbon,
      .ir-bumba-face {
        animation: none;
      }

      .ir-bumba-aura {
        opacity: 0;
      }
    }
  </style>

  <g fill="none" stroke="#fbbf24" stroke-width="3">
    <circle class="ir-bumba-aura" cx="40" cy="38" r="24" opacity="0" />
    <circle class="ir-bumba-aura ir-bumba-aura-2" cx="40" cy="38" r="24" opacity="0" />
  </g>

  <g filter="url(#ir-bumba-shadow)">
    <path
      d="M40 3C21.8 3 7 17.8 7 36c0 22.5 33 41 33 41s33-18.5 33-41C73 17.8 58.2 3 40 3Z"
      fill="url(#ir-bumba-pin)"
      stroke="#ffffff"
      stroke-width="2.5"
    />
  </g>

  <circle cx="40" cy="36" r="24" fill="#fff7ed" />

  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path class="ir-bumba-ribbon ir-bumba-ribbon-1" d="M37 24c-4-5-9-6-13-3" stroke="#22c55e" />
    <path class="ir-bumba-ribbon ir-bumba-ribbon-2" d="M40 23c-2-6-7-9-12-8" stroke="#facc15" />
    <path class="ir-bumba-ribbon ir-bumba-ribbon-3" d="M43 23c2-6 7-9 12-8" stroke="#ef4444" />
    <path class="ir-bumba-ribbon ir-bumba-ribbon-4" d="M46 24c4-5 9-6 13-3" stroke="#3b82f6" />
  </g>

  <g class="ir-bumba-face">
    <path
      d="M29 32c-6-7-13-6-16 0 5-1.5 9 0 12 5Z"
      fill="#fde68a"
      stroke="#92400e"
      stroke-width="1.1"
      stroke-linejoin="round"
    />
    <path
      d="M51 32c6-7 13-6 16 0-5-1.5-9 0-12 5Z"
      fill="#fde68a"
      stroke="#92400e"
      stroke-width="1.1"
      stroke-linejoin="round"
    />

    <ellipse cx="25" cy="37" rx="4.2" ry="6.4" fill="#c2410c" transform="rotate(-28 25 37)" />
    <ellipse cx="55" cy="37" rx="4.2" ry="6.4" fill="#c2410c" transform="rotate(28 55 37)" />

    <path
      d="M40 24c-9.5 0-16 5.5-16 13v5c0 8.5 7 15 16 15s16-6.5 16-15v-5c0-7.5-6.5-13-16-13Z"
      fill="#9a3412"
      stroke="#7c2d12"
      stroke-width="1.2"
    />

    <path
      d="M40 26c-2 3.5-5 5.5-5 8.5 0 3 2 5 5 5s5-2 5-5c0-3-3-5-5-8.5Z"
      fill="#fef3c7"
      opacity="0.95"
    />

    <circle cx="34" cy="39" r="2.6" fill="#ffffff" />
    <circle cx="46" cy="39" r="2.6" fill="#ffffff" />
    <circle cx="34.4" cy="39.4" r="1.2" fill="#1c1917" />
    <circle cx="46.4" cy="39.4" r="1.2" fill="#1c1917" />

    <ellipse cx="40" cy="49.5" rx="10" ry="7" fill="#fde68a" stroke="#b45309" stroke-width="1.2" />
    <ellipse cx="36.5" cy="49" rx="1.1" ry="1.4" fill="#7c2d12" />
    <ellipse cx="43.5" cy="49" rx="1.1" ry="1.4" fill="#7c2d12" />
    <path
      d="M36 53.5c2.5 1.6 5.5 1.6 8 0"
      fill="none"
      stroke="#7c2d12"
      stroke-width="1.2"
      stroke-linecap="round"
    />
  </g>

  <circle cx="40" cy="23.5" r="2.4" fill="#fbbf24" stroke="#b45309" stroke-width="0.8" />
</svg>
