<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ir-teatro-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#5b21b6" />
    </linearGradient>
    <filter id="ir-teatro-shadow" x="-30%" y="-20%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#4c1d95" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .ir-teatro-float {
      animation: ir-teatro-float 4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-teatro-left {
      animation: ir-teatro-sway 3.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ir-teatro-right {
      animation: ir-teatro-sway 3.2s ease-in-out infinite reverse;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes ir-teatro-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.2px); }
    }

    @keyframes ir-teatro-sway {
      0%, 100% { transform: rotate(-3.5deg); }
      50% { transform: rotate(3.5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ir-teatro-float,
      .ir-teatro-left,
      .ir-teatro-right {
        animation: none;
      }
    }
  </style>

  <g filter="url(#ir-teatro-shadow)">
    <path
      d="M20 2C10.8 2 3 9.8 3 19c0 11.5 17 19 17 19s17-7.5 17-19C37 9.8 29.2 2 20 2Z"
      fill="url(#ir-teatro-pin)"
      stroke="#ffffff"
      stroke-width="2"
    />
  </g>

  <circle cx="20" cy="18.5" r="14" fill="#f5f3ff" />

  <g class="ir-teatro-float">
    <g class="ir-teatro-left">
      <path
        d="M10.5 13.5h7.2v6.6c0 3.1-1.6 5.4-3.6 5.4s-3.6-2.3-3.6-5.4v-6.6Z"
        fill="#8b5cf6"
      />
      <circle cx="12.7" cy="17" r="0.85" fill="#ffffff" />
      <circle cx="15.6" cy="17" r="0.85" fill="#ffffff" />
      <path
        d="M12 20c1.4 1.5 3.2 1.5 4.6 0"
        fill="none"
        stroke="#ffffff"
        stroke-width="1"
        stroke-linecap="round"
      />
    </g>

    <g class="ir-teatro-right">
      <path
        d="M22.3 13.5h7.2v6.6c0 3.1-1.6 5.4-3.6 5.4s-3.6-2.3-3.6-5.4v-6.6Z"
        fill="#6d28d9"
      />
      <circle cx="24.5" cy="17" r="0.85" fill="#ffffff" />
      <circle cx="27.4" cy="17" r="0.85" fill="#ffffff" />
      <path
        d="M23.8 22c1.4-1.5 3.2-1.5 4.6 0"
        fill="none"
        stroke="#ffffff"
        stroke-width="1"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
